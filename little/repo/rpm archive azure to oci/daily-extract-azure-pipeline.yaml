# $modifiedBlobs = $blobContainers | ?{ ($_.LastModified -gt  "$LastModifiedSince")}


# 📌 Filters blobs that were modified in last 24 hours → $modifiedBlobs.

# Step by step:

# 1. $blobContainers

#       From earlier, this is the master list of all blobs across all containers in the source account.

# 2. | ?{ … }

#       ? is shorthand for Where-Object.

#       This filters the objects in the pipeline.

#       For each blob object, $_ represents the current blob.

# 3. ($_.LastModified -gt "$LastModifiedSince")

#       Each blob has a property LastModified (date/time when it was last updated).

#       $LastModifiedSince = the cutoff time (yesterday, from the [DateTime]::Now.AddDays(-1) line).

#       -gt means greater than (i.e., more recent than).

#       So only blobs modified after yesterday will be kept.

# ✅ Result: $modifiedBlobs now contains all blobs that were updated in the last 24 hours.

# ---------------------------------------------------------------------------------

# $modifiedContainers = $blobContainers | select -expand BlobClient  | select -expand BlobContainerName -unique

# 📌 Extracts unique container names where those blobs live → $modifiedContainers.

# Step by step:

# 1. $blobContainers: Again, the full blob list.

#       select -expand BlobClient : Each blob object has a property called BlobClient (this is a .NET object that represents the connection to that blob).

#       -expand unwraps that object instead of nesting it.

#       Now you’re working directly with the blob’s BlobClient.

# 2. select -expand BlobContainerName

#       From each BlobClient, pull out the name of the container the blob belongs to.

#       This turns the objects into plain strings like:

#           container1
#           container2
#           container1


# 4. -unique

#         Removes duplicates.

# So if multiple blobs from the same container were modified, the container name only appears once.

# ✅ Result: $modifiedContainers is a list of unique container names where modified blobs were found.

# ---------------------------------------------------------------------------------

