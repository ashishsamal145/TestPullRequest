# 📌 Ensures that destination storage account has the same containers.
# If not, creates them.

# Step by Step

# 1. $modifiedContainers | % { … }

#       % = shorthand for ForEach-Object.

#       This loops through each container name inside $modifiedContainers (the unique set of containers where modified blobs were found).

#       For each iteration, $_ = the current container name (a string, e.g., "container1").

# 2. If (-not (Get-AzStorageContainer -name $_ -Context $contextTo ))

#       Get-AzStorageContainer checks if a container with that name ($_) already exists in the destination account ($contextTo).

#       -not means if it does NOT exist.

#       So: “If this container is missing in the Extract account…”

# 3. write-host New-AzStorageContainer -Name "$_" -Context $contextTo.StorageAccountName

#       This just prints to the log what it’s about to do.

#       Useful for debugging / visibility in the Azure DevOps pipeline logs.

#       Notice it only prints the account name, not the full object.

# 4. if (-not $dryrun) { … }

#       $dryrun is a common pattern meaning “simulation mode.”

#       If $dryrun is not set (false), the script will actually perform the action.

#       If $dryrun is set, then it only logs what would happen but doesn’t make changes.

# 5. New-AzStorageContainer -Name "$_" -Context $contextTo

#       Actually creates the container in the destination account.

#       Example: if $_ = "container1", it runs:

#       New-AzStorageContainer -Name "container1" -Context $contextTo

# ✅ In plain words

#       This loop ensures that for every container that had modified blobs in the source account:

#       If the container does not already exist in the destination account,

#       Then create it (unless $dryrun is enabled, in which case just log it).

# 🔎 Example

# Suppose $modifiedContainers =

# container1
# container2


# Destination $contextTo currently only has container1.

# Loop results:

# For container1 → already exists → skip.

# For container2 → doesn’t exist → log message + create it in Extract.


