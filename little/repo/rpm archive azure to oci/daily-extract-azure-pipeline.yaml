# 📌 Loops through each modified blob:

# Logs the copy command.

# Actually runs Start-AzStorageBlobCopy to copy from Prod → Extract.

# Step by step

# 1. $modifiedBlobs | % { … }

#       % = ForEach-Object.

#       Loops through each blob in $modifiedBlobs.

#       $_ = current blob object.

#       Each blob has properties like:

#             Name → file name (report.csv, log.json, etc.)

#             BlobClient.BlobContainerName → which container it lives in

#             LastModified → timestamp

# 2. Write-Host Start-AzStorageBlobCopy …

#       This prints to the logs what copy command it is about to run.

#       Example output:

#       Start-AzStorageBlobCopy -SrcContainer container1 -SrcBlob report.csv -DestContainer container1 -DestBlob report.csv -Context mystorageprod -DestContext mystorageextract -Force


#       Notice here they used:

#         -Context $contextFrom.StorageAccountName
#         -DestContext $contextTo.StorageAccountName


# 👉 This is just for logging (printing the account name), not for real execution.

# 3. if (-not $dryrun) { Start-AzStorageBlobCopy … }

#       If $dryrun is false or not set, then it actually executes the copy.

#       If $dryrun is true, it only logs and skips the copy.

# 4. Start-AzStorageBlobCopy …

#       This cmdlet triggers an asynchronous copy of a blob from one storage account/container to another.

#       Key params:

#         -SrcContainer $_.BlobClient.BlobContainerName → source container name

#         -SrcBlob $_.Name → source blob name (file)

#         -DestContainer $_.BlobClient.BlobContainerName → destination container (same name as source here)

#         -DestBlob $_.Name → destination blob (same file name)

#         -Context $contextFrom → source account connection

#         -DestContext $contextTo → destination account connection

#         -Force → overwrite if the blob already exists

# So it’s literally doing:
# 👉 “Copy this blob from Prod → Extract, keeping the same container name and file name.”

# ✅ In plain words

#     For every blob that was modified in the last 24 hours:

#       Log the copy command that would run (helpful for debugging).

#       If not in dry-run mode → actually perform the blob copy from $contextFrom (Prod) to $contextTo (Extract).

# 🔎 Example

# Suppose $modifiedBlobs has one entry:

# Container = daily-data

# Blob name = report-2025-08-27.csv

# The script will:

# Print:

# Start-AzStorageBlobCopy -SrcContainer daily-data -SrcBlob report-2025-08-27.csv -DestContainer daily-data -DestBlob report-2025-08-27.csv -Context mystorageprod -DestContext mystorageextract -Force


# If $dryrun = $false, actually copy the blob from Prod/daily-data → Extract/daily-data.


