# training-pipeline-azure.yaml

trigger: 
 paths:
  include:
   - training-pipeline-azure.yml
 branches:
  include:
   - master
   - develop
parameters:
- name: AZURE_MODEL2_OUTPUT_CONTAINER
  displayName: AZURE_MODEL2_OUTPUT_CONTAINER
  type: string
  default: autotrain-model2-output
- name: AZURE_STORAGE_WORKSPACE_CONTAINER
  displayName: AZURE_STORAGE_WORKSPACE_CONTAINER
  type: string
  default: autotrain-workspace
schedules:
- cron: "00 05 01 02,05,08,11 *"
  displayName: Quarterly at Midnight (EST)
  branches:
    include:
    - master
  always: true
# Pipeline triggered by a pipeline
resources:
  pipelines:
   - pipeline: sourcetrainbuild
     project: "Revenue Prediction"
     source: "[Build] M1M2 train image"
     trigger:
      branches:
        include:
        - develop
        - main
        - master
  repositories:
  - repository: scripts
    type: git
    name: Revenue Prediction/pipeline scripts
    ref: master
variables:
- group: 'Azure Variables'
- name: TrainTimestamp
  value: SetByInitialStage
- name: TrainImageName
  value: revenue-prediction-m1-m2-train
- name: jobName
  value: model-training
- name: jobManifest
  value: model-training-job.yaml
stages:
- stage: SetTimestamp
  displayName: Set the Timestamp for the training data
  jobs:  
  - job: Prepare
    displayName: Prepare
    timeoutInMinutes: 300
    pool: "msalowgts-devopvmss"
    steps:
    - checkout: scripts
    - task: PowerShell@2
      inputs:
        targetType: 'inline'
        script: 'gci env:RESOURCES* | Sort-Object -Property key | format-table -wrap'
      displayName: 'Display environment'
    - bash: |
        TRAIN_TIMESTAMP="$(date +"%Y%m%d%H%M")"
        # place in a file to be available to future stages
        echo "${TRAIN_TIMESTAMP}" >  TrainTimestamp.txt
        # expose timestamp in build variable
        echo "##vso[task.setvariable variable=TrainTimestamp;]${TRAIN_TIMESTAMP}" 
      displayName: 'Set training timestamp'
    - task: CopyFiles@2
      displayName: 'Copy timestamp file for later use in the pipeline'
      inputs:
        contents: 'TrainTimestamp.txt'
        targetFolder: '$(Build.ArtifactStagingDirectory)'
    - publish: '$(Build.ArtifactStagingDirectory)'
      displayName: 'Publish timestamp file for later use'
      artifact: scratchpad
    - bash: |
        echo "TrainTimestamp is [$(TrainTimestamp)]"   
      displayName: 'Show results of train timestamp'

- stage: DevTrain
  displayName: Dev- Generate and publish training data
  dependsOn: SetTimestamp
  variables:
    aksName: 'set in script'
    aksResourceGroup: 'set in script'
    namespace: 'set in script'
    AzureStorageAccount: 'set in script'
  jobs:  
  - deployment: Training
    environment: development
    displayName: Generate and publish training data
    timeoutInMinutes: 300
    pool: "msalowgts-devopvmss"
    strategy:
      runOnce:
        deploy:
          steps:  
          - checkout: scripts
          - template: pipeline-templates/deployTrainJobManifest.yml
            parameters:
              DEPLOYMENT_SERVICE_CONNECTION: cfo-apps-revpred-deploy-dev-AKSLOWDEVPRV001
              NAMESPACE: cfo-apps-revpred-dev
              AZURE_STORAGE_ACCOUNT: revpredtempblobdev
              AZURE_STORAGE_ACCOUNT_SAS_TOKEN: $(AzureSASTokenDev)
              AZURE_MODEL2_OUTPUT_CONTAINER: '${{parameters.AZURE_MODEL2_OUTPUT_CONTAINER}}' 
              AZURE_STORAGE_WORKSPACE_CONTAINER: '${{parameters.AZURE_STORAGE_WORKSPACE_CONTAINER}}'
              ARTIFACT_NAME: devresults
- stage: ProdTrain
  displayName: Production- Generate and publish training data
  dependsOn: DevTrain
  # todo: change build.sourceBranch to resources.pipeline.sourceTrainBuild.sourceBranch for other artifact
  condition: and(succeeded(), or(eq(variables['resources.pipeline.sourceTrainBuild.sourceBranch'], 'refs/heads/main'),eq(variables['resources.pipeline.sourceTrainBuild.sourceBranch'], 'refs/heads/master')))
  variables:
    aksName: 'set in script'
    aksResourceGroup: 'set in script'
    namespace: 'set in script'
    AzureStorageAccount: 'set in script'
  jobs:  
  - deployment: Training
    environment: trainingforproduction
    displayName: Generate and publish training data
    timeoutInMinutes: 300
    pool: "msalowgts-devopvmss"
    strategy:
      runOnce:
        deploy:
          steps:  
          - checkout: scripts
          - template: pipeline-templates/deployTrainJobManifest.yml
            parameters:
              DEPLOYMENT_SERVICE_CONNECTION: cfo-apps-revpred-deploy-prod-AKSLOWPRODPRV002
              NAMESPACE: cfo-apps-revpred-prod
              AZURE_STORAGE_ACCOUNT: revpredtempblob
              AZURE_STORAGE_ACCOUNT_SAS_TOKEN: $(AzureSASTokenProd)
              AZURE_MODEL2_OUTPUT_CONTAINER: '${{parameters.AZURE_MODEL2_OUTPUT_CONTAINER}}' 
              AZURE_STORAGE_WORKSPACE_CONTAINER: '${{parameters.AZURE_STORAGE_WORKSPACE_CONTAINER}}'
              ARTIFACT_NAME: prodresults

=============================================================================================================================================================================================

Explanation:---------------------------------------------------------------------------------------------

Short summary first: this is an Azure DevOps multi-stage pipeline that creates a timestamp, runs a dev training job (by applying a Kubernetes Job manifest template into a dev AKS cluster), and — if the earlier steps succeed and the build source is main/master — repeats the same in prod. Below I walk through each line/statement and explain what it does.

# training-pipeline-azure.yaml


Comment/filename — not executed.

trigger: 
 paths:
  include:
   - training-pipeline-azure.yml
 branches:
  include:
   - master
   - develop


trigger: — configures CI triggers.

paths: / include: - training-pipeline-azure.yml — only changes under that path/file will trigger the pipeline.

branches: / include: - master, - develop — triggers are limited to commits on master and develop branches.

=============================================================================================================================================================================================

parameters:
- name: AZURE_MODEL2_OUTPUT_CONTAINER
  displayName: AZURE_MODEL2_OUTPUT_CONTAINER
  type: string
  default: autotrain-model2-output
- name: AZURE_STORAGE_WORKSPACE_CONTAINER
  displayName: AZURE_STORAGE_WORKSPACE_CONTAINER
  type: string
  default: autotrain-workspace


parameters: — runtime/configurable inputs to the pipeline.

First parameter AZURE_MODEL2_OUTPUT_CONTAINER:

displayName is what shows in the UI, type: string, default value autotrain-model2-output.

Second parameter AZURE_STORAGE_WORKSPACE_CONTAINER:

similar, default autotrain-workspace.

These let you override which Azure blob containers the pipeline will use when you queue the run.
=============================================================================================================================================================================================

schedules:
- cron: "00 05 01 02,05,08,11 *"
  displayName: Quarterly at Midnight (EST)
  branches:
    include:
    - master
  always: true


schedules: defines a scheduled (cron) run.

cron: "00 05 01 02,05,08,11 *" — cron expression: minute 00, hour 05 UTC, day 01 of months 02,05,08,11 (Feb/May/Aug/Nov). That corresponds to midnight Eastern Standard Time when EST is UTC−5 (note DST considerations).

displayName is just a label.

branches.include: - master — schedule runs only against master.

always: true — run even if there are no code changes.
=============================================================================================================================================================================================

# Pipeline triggered by a pipeline
resources:
  pipelines:
   - pipeline: sourcetrainbuild
     project: "Revenue Prediction"
     source: "[Build] M1M2 train image"
     trigger:
      branches:
        include:
        - develop
        - main
        - master


resources.pipelines declares a pipeline resource dependency named sourcetrainbuild.

project: "Revenue Prediction" and source: "[Build] M1M2 train image" tell DevOps which pipeline artifact to consume.

trigger.branches.include lists branches of that upstream pipeline that should trigger this pipeline resource (so changes/builds in the source pipeline can kick this pipeline).
=============================================================================================================================================================================================

  repositories:
  - repository: scripts
    type: git
    name: Revenue Prediction/pipeline scripts
    ref: master


This is adding an extra Git repository into the pipeline (besides the repo where the pipeline YAML itself lives).

repository: scripts → This is the alias you will use inside the pipeline (checkout: scripts).

type: git → It’s a Git repo inside Azure Repos Git (not GitHub or Bitbucket).

name: Revenue Prediction/pipeline scripts → The path to the repo in your Azure DevOps project.

Revenue Prediction = project name

pipeline scripts = repository name

ref: master → Always use the master branch of that repo.

🔹 How it’s used later:

In your pipeline, you see:

- checkout: scripts


→ This checks out that external repo’s contents into the pipeline workspace.

Also, the templates you call:

- template: pipeline-templates/deployTrainJobManifest.yml


are likely stored inside this pipeline scripts repo.

👉 So basically:
This section pulls in a shared scripts/templates repo so that multiple pipelines can reuse the same deployment logic instead of duplicating YAML.

