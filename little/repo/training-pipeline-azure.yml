Includes a reusable template deployTrainJobManifest.yml from pipeline-templates folder.

Passes parameters into the template:

DEPLOYMENT_SERVICE_CONNECTION — the Azure service connection to use for kubectl/aks access (dev).

NAMESPACE — Kubernetes namespace cfo-apps-revpred-dev.

AZURE_STORAGE_ACCOUNT — temp storage account for dev revpredtempblobdev.

AZURE_STORAGE_ACCOUNT_SAS_TOKEN — SAS token variable $(AzureSASTokenDev) pulled from library/variables.

AZURE_MODEL2_OUTPUT_CONTAINER and AZURE_STORAGE_WORKSPACE_CONTAINER are passed through from the top-level parameters.

ARTIFACT_NAME: devresults — name under which the job will publish its results/artifacts.

Effect: the template will create/update Kubernetes secrets/configmaps and kubectl apply the job manifest (using jobManifest) to run the training job on the dev AKS cluster.

