#  m3-training-pipeline-azure.yaml

trigger:
 paths:
  include:
   - m3-training-pipeline-azure.yml
 branches:
  include:
   - main
   - master
   - develop
parameters:
- name: AZURE_MODEL2_OUTPUT_CONTAINER
  displayName: AZURE_MODEL2_OUTPUT_CONTAINER
  type: string
  default: autotrain-model2-output
- name: AZURE_STORAGE_WORKSPACE_CONTAINER
  displayName: AZURE_STORAGE_WORKSPACE_CONTAINER
  type: string
  default: autotrain-workspace
schedules:
- cron: "00 05 01 02,05,08,11 *"
  displayName: Quarterly at Midnight (EST)
  branches:
    include:
    - master
  always: true
# Pipeline triggered by a pipeline
resources:
  pipelines:
   - pipeline: sourcetrainbuild
     project: "Revenue Prediction"
     source: "[Build] M3 train image"
     trigger:
      branches:
        include:
        - develop
        - main
        - master
  repositories:
  - repository: scripts
    type: git
    name: Revenue Prediction/pipeline scripts
    ref: master
variables:
- group: 'Azure Variables'
- name: TrainTimestamp
  value: SetByInitialStage
- name: TrainImageName
  value: revenue-prediction-m3-train
- name: jobName
  value: m3-model-training
- name: jobManifest
  value: m3-model-training-job.yaml
stages:
- stage: SetTimestamp
  displayName: Set the Timestamp for the training data
  jobs:  
  - job: Prepare
    displayName: Prepare
    timeoutInMinutes: 300
    pool: "msalowgts-devopvmss"
    steps:
    - checkout: scripts
    - task: PowerShell@2
      inputs:
        targetType: 'inline'
        script: 'gci env:RESOURCES* | Sort-Object -Property key | format-table -wrap'
      displayName: 'Display environment'
    - bash: |
        TRAIN_TIMESTAMP="$(date +"%Y%m%d%H%M")"
        # place in a file to be available to future stages
        echo "${TRAIN_TIMESTAMP}" >  TrainTimestamp.txt
        # expose timestamp in build variable
        echo "##vso[task.setvariable variable=TrainTimestamp;]${TRAIN_TIMESTAMP}" 
      displayName: 'Set training timestamp'
    - task: CopyFiles@2
      displayName: 'Copy timestamp file for later use in the pipeline'
      inputs:
        contents: 'TrainTimestamp.txt'
        targetFolder: '$(Build.ArtifactStagingDirectory)'
    - publish: '$(Build.ArtifactStagingDirectory)'
      displayName: 'Publish timestamp file for later use'
      artifact: scratchpad
    - bash: |
        echo "TrainTimestamp is [$(TrainTimestamp)]"   
      displayName: 'Show results of train timestamp'

- stage: DevTrain
  displayName: Dev- Generate and publish training data
  dependsOn: SetTimestamp
  variables:
    aksName: 'set in script'
    aksResourceGroup: 'set in script'
    namespace: 'set in script'
    AzureStorageAccount: 'set in script'
  jobs:  
  - deployment: Training
    environment: development
    displayName: Generate and publish training data
    timeoutInMinutes: 300
    pool: "msalowgts-devopvmss"
    strategy:
      runOnce:
        deploy:
          steps:  
          - checkout: scripts
          - template: pipeline-templates/deployTrainJobManifest.yml
            parameters:
              DEPLOYMENT_SERVICE_CONNECTION: cfo-apps-revpred-deploy-dev-AKSLOWDEVPRV001
              NAMESPACE: cfo-apps-revpred-dev
              AZURE_STORAGE_ACCOUNT: revpredtempblobdev
              AZURE_STORAGE_ACCOUNT_SAS_TOKEN: $(AzureSASTokenDev)
              AZURE_MODEL2_OUTPUT_CONTAINER: '${{parameters.AZURE_MODEL2_OUTPUT_CONTAINER}}' 
              AZURE_STORAGE_WORKSPACE_CONTAINER: '${{parameters.AZURE_STORAGE_WORKSPACE_CONTAINER}}'
              ARTIFACT_NAME: devresults
- stage: ProdTrain
  displayName: Production- Generate and publish training data
  dependsOn: DevTrain
  # todo: change build.sourceBranch to resources.pipeline.sourceTrainBuild.sourceBranch for other artifact
  condition: and(succeeded(), or(eq(variables['resources.pipeline.sourceTrainBuild.sourceBranch'], 'refs/heads/main'),eq(variables['resources.pipeline.sourceTrainBuild.sourceBranch'], 'refs/heads/master')))
  variables:
    aksName: 'set in script'
    aksResourceGroup: 'set in script'
    namespace: 'set in script'
    AzureStorageAccount: 'set in script'
  jobs:  
  - deployment: Training
    environment: trainingforproduction
    displayName: Generate and publish training data
    timeoutInMinutes: 300
    pool: "msalowgts-devopvmss"
    strategy:
      runOnce:
        deploy:
          steps:  
          - checkout: scripts
          - template: pipeline-templates/deployTrainJobManifest.yml
            parameters:
              DEPLOYMENT_SERVICE_CONNECTION: cfo-apps-revpred-deploy-prod-AKSLOWPRODPRV002
              NAMESPACE: cfo-apps-revpred-prod
              AZURE_STORAGE_ACCOUNT: revpredtempblob
              AZURE_STORAGE_ACCOUNT_SAS_TOKEN: $(AzureSASTokenProd)
              AZURE_MODEL2_OUTPUT_CONTAINER: '${{parameters.AZURE_MODEL2_OUTPUT_CONTAINER}}' 
              AZURE_STORAGE_WORKSPACE_CONTAINER: '${{parameters.AZURE_STORAGE_WORKSPACE_CONTAINER}}'
              ARTIFACT_NAME: prodresults


