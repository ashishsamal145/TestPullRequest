# redis-deployment.yaml

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-azure-managed-disk
spec:
  accessModes:
  # Many allows new pod to come into service before old pod stops for patching
  - ReadWriteMany
  storageClassName: managed-premium
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: revpred-cache
spec:
  replicas: 1
  selector:
    matchLabels:
      app: revpred-cache
  template:
    metadata:
      labels:
        app: revpred-cache
    spec:
      nodeSelector:
        "beta.kubernetes.io/os": linux
      containers:
      - name: revpred-cache
        image: redis:alpine
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 250m
            memory: 256Mi
        ports:
        - containerPort: 6379
          name: redis
        volumeMounts:
        - mountPath: "/data"
          name: redis-volume
      volumes:
        - name: redis-volume
          persistentVolumeClaim:
            claimName: redis-azure-managed-disk
---
apiVersion: v1
kind: Service
metadata:
  name: revpred-cache
spec:
  ports:
  - port: 6379
  selector:
    app: revpred-cache

Explanation:----------------------------------------------------------

# 1) PersistentVolumeClaim (PVC)
# apiVersion: v1


# Use core/v1 API objects.

# kind: PersistentVolumeClaim


# We’re creating a PVC to request storage.

# metadata:
#   name: redis-azure-managed-disk


# PVC name = redis-azure-managed-disk.

# spec:
#   accessModes:


# Start of PVC spec and its access modes.

#   # Many allows new pod to come into service before old pod stops for patching
#   - ReadWriteMany


# Requested access mode = ReadWriteMany (RWX).

# ⚠️ AKS note: managed-premium (Azure Managed Disk) does not support RWX—only ReadWriteOnce. RWX typically requires Azure Files. With managed-premium, this PVC will likely stay Pending. Consider ReadWriteOnce or switch to an Azure Files storage class.

#   storageClassName: managed-premium


# Use the Azure Managed Disk (Premium) storage class.

#   resources:
#     requests:
#       storage: 5Gi


# Request a 5 GiB disk.

# ---


# YAML document separator (next object).

# 2) Deployment (Redis Pod)
# apiVersion: apps/v1


# Apps/v1 API for Deployments.

# kind: Deployment


# We’re deploying a Deployment.

# metadata:
#   name: revpred-cache


# Deployment name = revpred-cache.

# spec:
#   replicas: 1


# Run one replica (single Redis instance).

#   selector:
#     matchLabels:
#       app: revpred-cache


# Label selector that finds pods with app=revpred-cache.

#   template:
#     metadata:
#       labels:
#         app: revpred-cache


# Pod template: applies the label app=revpred-cache so the selector matches.

#     spec:
#       nodeSelector:
#         "beta.kubernetes.io/os": linux


# Schedule only on Linux nodes.

# ℹ️ Deprecation: beta.kubernetes.io/os is deprecated. Use kubernetes.io/os: linux.

#       containers:
#       - name: revpred-cache


# Define a single container named revpred-cache.

#         image: redis:alpine


# Use the lightweight Redis Alpine image.

#         resources:
#           requests:
#             cpu: 100m
#             memory: 128Mi
#           limits:
#             cpu: 250m
#             memory: 256Mi


# Resource requests/limits: 0.1–0.25 CPU, 128–256 MiB RAM.

#         ports:
#         - containerPort: 6379
#           name: redis


# Expose container port 6379 (default Redis port); name the port redis.

#         volumeMounts:
#         - mountPath: "/data"
#           name: redis-volume


# Mount a volume at /data—Redis writes snapshots/AOF here if enabled (data persistence).

#       volumes:
#         - name: redis-volume
#           persistentVolumeClaim:
#             claimName: redis-azure-managed-disk


# Back the redis-volume with the PVC created above.

# ---


# YAML document separator (next object).

# 3) Service (in-cluster access to Redis)
# apiVersion: v1


# Core/v1 Service.

# kind: Service


# Create a Service.

# metadata:
#   name: revpred-cache


# Service name = revpred-cache.

# spec:
#   ports:
#   - port: 6379


# Expose port 6379 on the Service (ClusterIP by default).

#   selector:
#     app: revpred-cache


# Route traffic to pods with label app=revpred-cache (the Deployment’s pods).

# ℹ️ Because no type is specified, this is a ClusterIP service—reachable only inside the cluster. Clients in the same namespace can connect via revpred-cache:6379.

# Key gotchas & improvements

# RWX vs managed-premium: Azure Managed Disks don’t support ReadWriteMany.

# If you must use Managed Disk: change to accessModes: [ReadWriteOnce]. (You already run replicas: 1, so it’s fine.)

# If you need RWX: use an Azure Files storage class (e.g., azurefile-csi), not managed-premium.

# Node selector label: Switch to:

# nodeSelector:
#   kubernetes.io/os: linux


# Security: The default Redis image has no auth. Because the Service is ClusterIP, it’s internal, but consider enabling a password (require requirepass via a config file/Env) if multi-tenant.

# Persistence behavior: The stock redis:alpine uses default redis.conf. If you rely on persistence, ensure RDB/AOF config matches your needs and points to /data.

# PodDisruptionBudget / Liveness/Readiness: For production, add probes and (optionally) a PDB if you later scale or need maintenance safety.

