# web-deployment.yaml


apiVersion: apps/v1
kind: Deployment
metadata:
  name: revpred-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: revpred-web
  template:
    metadata:
      labels:
        app: revpred-web
    spec:
      nodeSelector:
        "beta.kubernetes.io/os": linux
      containers:
      - name: revpred-web
        # replace latest to selected build for deployment (option in devops kubernetes manifest task)
        image: rtirevenueprediction.azurecr.io/revenue-prediction:latest
        # change args for spin & wait forever
        # command: [ "sh", "-c", "--" ]
        # args: [ "while true; do sleep 30; done;" ]
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 250m
            memory: 512Mi
        ports:
        - containerPort: 3000
        imagePullPolicy: Always
        envFrom:
        - secretRef:
            name: revenueprediction-web-secret
---
apiVersion: v1
kind: Service
metadata:
  name: revpred-web
  annotations:
    service.beta.kubernetes.io/azure-dns-label-name: revpred-web-aks
    service.beta.kubernetes.io/azure-load-balancer-internal: "true"
spec:
  ports:
  - port: 3000
  selector:
    app: revpred-web
  type: LoadBalancer
  # replace {webStaticIp} in manifest task
  # static, so it can be routed to from the F5
  # prod should be 10.196.103.248
  # dev should be 10.196.103.249
  loadBalancerIP: {webStaticIp}


