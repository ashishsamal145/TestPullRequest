# 🚀 Summary

# This file defines:

# Deployment (revpred-web)

# Runs one replica of the revenue prediction web app.

# Uses a container from Azure Container Registry.

# Listens on port 3000.

# Uses secrets for configuration.

# Requests minimal CPU/memory, limits to avoid overuse.

# Runs only on Linux nodes.

# Service (revpred-web)

# Type = LoadBalancer.

# Exposes port 3000 via Azure internal Load Balancer.

# Uses a static private IP so external infra (e.g., F5) can route reliably.

# Gets an Azure DNS label for service discovery.
