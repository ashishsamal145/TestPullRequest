#                 value: "azure"


# Instructs the job to read from and write to Azure storage.

#               - name: BYPASS_DOTENV
#                 value: "1"


# Skip loading a local .env; rely on K8s env/secret/config instead.

#               envFrom:


# Bulk-import environment variables from Secret/ConfigMap:

