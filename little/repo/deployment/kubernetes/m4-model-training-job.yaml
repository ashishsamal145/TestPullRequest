# #        concurrencyPolicy: Forbid 


# Start of the Job spec. If you converted to a CronJob, you’d use schedule (every minute in this example) and prevent overlaps with concurrencyPolicy: Forbid.

#         ttlSecondsAfterFinished: 3600  # logs are in devops - no reason to keep the job after completion


# Tell Kubernetes to garbage-collect the finished Job after 1 hour (3600 seconds).

#         template:
#           metadata:
#             name: model-training-sequenced-job-{TRAIN_TIMESTAMP}


# Pod template for the Job. Pods spawned by this Job will use this metadata name pattern (also timestamped).

#           spec:


# Begin Pod spec (what actually runs).

#       # would be nice to have 
#       #      securityContext:
#       #        runAsUser: 1001
