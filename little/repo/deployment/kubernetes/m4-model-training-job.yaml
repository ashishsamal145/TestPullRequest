# m4-model-training-job.yaml

apiVersion: batch/v1
kind: Job
# kind: CronJob
metadata:
        name: m4-model-training-sequenced-job-{TRAIN_TIMESTAMP}
spec:
#       uncomment if cronjob
#        schedule: "*/1 * * * *"
#        concurrencyPolicy: Forbid 

        ttlSecondsAfterFinished: 3600  # logs are in devops - no reason to keep the job after completion
        template:
          metadata:
            name: model-training-sequenced-job-{TRAIN_TIMESTAMP}
          spec:
      # would be nice to have 
      #      securityContext:
      #        runAsUser: 1001
      #        fsGroup: 1001 
            initContainers:
            - name: revenue-prediction-m1-m2-train
              image: rtirevenueprediction.azurecr.io/revenue-prediction-m4-train:latest
              # memory request forces job/pod to the larger node pool
              imagePullPolicy: IfNotPresent
              resources:
                requests:
                  memory: "8000Mi"
              env:
              # moving this to the config map will prevent parallel runs. so leave it here even though it's common
              - name: TIMESTAMP
                value: "{TRAIN_TIMESTAMP}"
              - name: READ
                value: "azure"
              - name: WRITE
                value: "azure"
              - name: BYPASS_DOTENV
                value: "1"
              envFrom:
              # kubernetes secret loaded from build pipeline
              - secretRef:
                  name: m4-model-training-secret
              - configMapRef:
                  name: m4-model-training-config
            containers:
            - name: job-done
              image: busybox
              command: ['sh', '-c', 'echo "training completed"']
            dnsPolicy: ClusterFirst
            restartPolicy: Never


# Explanation:-----------------------------------------------------------------------------------

# .

# apiVersion: batch/v1


# Use the batch/v1 API group (Jobs / CronJobs).

# kind: Job
# # kind: CronJob


# Create a one-off Job. The commented line shows you could switch to a CronJob if you wanted a schedule.

