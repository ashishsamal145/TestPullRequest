#             - name: revenue-prediction-m1-m2-train


# Init container name (label is historical; this one actually trains M4).

#               image: rtirevenueprediction.azurecr.io/revenue-prediction-m4-train:latest


# Container image from ACR: the M4 training image, tag latest.

#               # memory request forces job/pod to the larger node pool
