#                   name: m4-model-training-config


# Load non-sensitive settings (paths, flags, parameters) from ConfigMap m4-model-training-config.

#             containers:


# Define the main containers (run after all init containers succeed).

#             - name: job-done
#               image: busybox
#               command: ['sh', '-c', 'echo "training completed"']


# A tiny container that just prints “training completed”.
# 👉 The real training work ran in the init container; this container’s success marks the Job as complete.

#             dnsPolicy: ClusterFirst


# Use cluster DNS for name resolution (default).

#             restartPolicy: Never


# Do not restart containers in this Pod if they exit (success or failure).
# (Note: the Job controller may still retry by creating a new Pod up to its backoff limit—default is 6—since backoffLimit isn’t set here.)

# TL;DR

# Runs a one-shot M4 model training via an initContainer using revenue-prediction-m4-train:latest.

# Injects timestamps, storage mode (Azure), and secrets/configs as environment.

# After training completes, a trivial “job-done” container prints a message so the Job ends cleanly.

# Job objects are auto-deleted after 1 hour.

# No restarts inside the Pod; failures bubble up to the Job (which may retry with a fresh Pod).
