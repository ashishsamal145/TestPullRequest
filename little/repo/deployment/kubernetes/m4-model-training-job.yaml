#               - name: TIMESTAMP
#                 value: "{TRAIN_TIMESTAMP}"


# TIMESTAMP placeholder—CI/CD injects the concrete training timestamp (used for run IDs, paths, etc.).

#               - name: READ
#                 value: "azure"
