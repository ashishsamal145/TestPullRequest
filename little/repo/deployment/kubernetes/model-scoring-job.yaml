# metadata.name → Name of the resource: model-scoring-cronjob.

# 📌 Spec – Scheduling & Job Definition
# spec:
#   # note that AKS scheduling is by UMT.  below is 6:45 EDT 
#   schedule: "45 10 * * *"


# This runs the job every day at 10:45 UTC (which is 6:45 AM EDT).

# Cron format = minute hour day month weekday.

#   jobTemplate:
#     spec:
#       ttlSecondsAfterFinished: 3600


# Defines the job template (what to run when scheduled).

# ttlSecondsAfterFinished: 3600 → after the job finishes, Kubernetes cleans up the Job object after 1 hour.

# 📌 Pod Template for Each Job
#       template:
#         metadata:
#           name: model-scoring-cronjob


# Pods that run under this job will be named model-scoring-cronjob-xxxxx.

