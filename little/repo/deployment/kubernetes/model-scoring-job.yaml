# model-scoring-job.yaml

apiVersion: batch/v1
kind: CronJob
metadata:
  name: model-scoring-cronjob
spec:
  # note that AKS scheduling is by UMT.  below is 6:45 EDT 
  schedule: "45 10 * * *"
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 3600
      template:
        metadata:
          name: model-scoring-cronjob
        spec:
          restartPolicy: Never
          volumes:
          - name: scoring-data
            persistentVolumeClaim:
                claimName: model-scoring-pv-claim
          containers:
          - name: job-done
            image: busybox
            command: ['sh', '-c', 'echo "scoring completed"']
          dnsPolicy: ClusterFirst
          restartPolicy: Never
          initContainers:
          - name: set-timestamps
            image: alpine:3.7
            command: ["/bin/sh", "-c"]
            args:
            - mkdir -p /persist/logs;
              find /persist/logs -type f -mtime +30 -delete;
              env | grep -i -v key;
              echo "$(date +"%Y%m%d%H%M")" > /persist/ScoreTimestamp.txt;
              echo "$TRAIN_TIMESTAMP" > /persist/TrainTimestamp.txt;
              echo "$M3_TRAIN_TIMESTAMP" > /persist/M3_PipelineTimestamp.txt;
              echo "$M4_TRAIN_TIMESTAMP" > /persist/M4_PipelineTimestamp.txt;
            env:
            # moving this to the config map will prevent parallel runs. so leave it here even though it's common
            - name: TRAIN_TIMESTAMP
              #  value: "202308010500"
              value: "{TRAIN_TIMESTAMP}"
            - name: M3_TRAIN_TIMESTAMP
              # value: "202308162057"
              value: "{M3_TRAIN_TIMESTAMP}"
            - name: M4_TRAIN_TIMESTAMP
              # value: "202308162005"
              value: "{M4_TRAIN_TIMESTAMP}"
            volumeMounts:
            - mountPath: /persist
              name: scoring-data              
          - name: revenue-prediction-m1-m2-score
            image: rtirevenueprediction.azurecr.io/revenue-prediction-m1-m2:20230717.1 
            # memory request forces job/pod to the larger node pool
            command: ["/bin/sh", "-c"]
            args:
            - export SCORE_TIMESTAMP=$( cat /persist/ScoreTimestamp.txt);
              export TRAIN_TIMESTAMP=$( cat /persist/TrainTimestamp.txt);
              Rscript --verbose score.r | tee -a /persist/m1-score-${SCORE_TIMESTAMP}.log
            imagePullPolicy: IfNotPresent
            resources:
              requests:
                memory: "8000Mi"
            env:
            - name: WORKSPACE
              value: "azure"
            # set on each iteration   SCORE_TIMESTAMP=$(cat $(ScoreTimestampFilepath))  
            - name: AZURE_STORAGE_WORKSPACE_CONTAINER
              valueFrom:
                configMapKeyRef:
                  name: model-scoring-config
                  key: AZURE_STORAGE_WORKSPACE_CONTAINER               
            - name: AZURE_STORAGE_OUTPUT_CONTAINER
              valueFrom:
                configMapKeyRef:
                  name: model-scoring-config
                  key: AZURE_MODEL2_OUTPUT_CONTAINER
            envFrom:
            # kubernetes secret loaded from build pipeline
            - secretRef:
                name: model-scoring-secret
            - configMapRef:
                name: model-scoring-config
            volumeMounts:
            - mountPath: /persist
              name: scoring-data   
          - name: revenue-prediction-m3-score-backlog
            image: rtirevenueprediction.azurecr.io/revenue-prediction-m3-score:20230816.2
            # memory request forces job/pod to the larger node pool
            command: ["/bin/sh", "-c"]
            args:
            - export SCORE_TIMESTAMP=$(cat /persist/ScoreTimestamp.txt);
              export TRAIN_TIMESTAMP=$(cat /persist/M3_PipelineTimestamp.txt);
              env;
              .  ./scripts/score_docker_entrypoint.sh 
            imagePullPolicy: IfNotPresent
            resources:
             requests:
                 memory: "8000Mi"
            env:
            - name: JOB
              value: "backlog"
            envFrom:
            # kubernetes secret loaded from build pipeline
            - secretRef:
                name: model-scoring-secret
            - configMapRef:
                name: model-scoring-config
            volumeMounts:
            - mountPath: /persist
              name: scoring-data   
          - name: revenue-prediction-m3-score-opportunities
            image: rtirevenueprediction.azurecr.io/revenue-prediction-m3-score:20230816.2
            # memory request forces job/pod to the larger node pool
            command: ["/bin/sh", "-c"]
            args:
            - export SCORE_TIMESTAMP=$(cat /persist/ScoreTimestamp.txt);
              export TRAIN_TIMESTAMP=$(cat /persist/M3_PipelineTimestamp.txt);
              env;
              .  ./scripts/score_docker_entrypoint.sh 
            imagePullPolicy: IfNotPresent
            resources:
              requests:
                memory: "8000Mi"
            env:
            - name: JOB
              value: "opportunities"
            envFrom:
            # kubernetes secret loaded from build pipeline
            - secretRef:
                name: model-scoring-secret
            - configMapRef:
                name: model-scoring-config
            volumeMounts:
            - mountPath: /persist
              name: scoring-data   

          - name: revenue-prediction-m4-score-backlog
            image: rtirevenueprediction.azurecr.io/revenue-prediction-m4-score:20230816.1
            # memory request forces job/pod to the larger node pool
            command: ["/bin/sh", "-c"]
            args:
            - export SCORE_TIMESTAMP=$(cat /persist/ScoreTimestamp.txt);
              export TRAIN_TIMESTAMP=$(cat /persist/M4_PipelineTimestamp.txt);
              env;
              .  ./scripts/score_docker_entrypoint.sh 
            imagePullPolicy: IfNotPresent
            resources:
              requests:
                memory: "8000Mi"
            env:
            - name: JOB
              value: "backlog"
            envFrom:
            # kubernetes secret loaded from build pipeline
            - secretRef:
                name: model-scoring-secret
            - configMapRef:
                name: model-scoring-config
            volumeMounts:
            - mountPath: /persist
              name: scoring-data   
          - name: revenue-prediction-m4-score-opportunities
            image: rtirevenueprediction.azurecr.io/revenue-prediction-m4-score:20210609.1
            # memory request forces job/pod to the larger node pool
            command: ["/bin/sh", "-c"]
            args:
            - export SCORE_TIMESTAMP=$(cat /persist/ScoreTimestamp.txt);
              export TRAIN_TIMESTAMP=$(cat /persist/m4_PipelineTimestamp.txt);
              env;
              .  ./scripts/score_docker_entrypoint.sh 
            imagePullPolicy: IfNotPresent
            resources:
              requests:
                memory: "8000Mi"
            env:
            - name: JOB
              value: "opportunities"
            envFrom:
            # kubernetes secret loaded from build pipeline
            - secretRef:
                 name: model-scoring-secret
            - configMapRef:
                 name: model-scoring-config
            volumeMounts:
            - mountPath: /persist
              name: scoring-data  
              
          - name: revenue-prediction-m5-score
            image: rtirevenueprediction.azurecr.io/revenue-prediction-m5:20230817.3
            # memory request forces job/pod to the larger node pool
            command: ["/bin/sh", "-c"]
            args:
             - export SCORE_TIMESTAMP=$(cat /persist/ScoreTimestamp.txt);
               export M2_TRAIN_TIMESTAMP=$(cat /persist/TrainTimestamp.txt);
               export M3_PREPROCESS_TIMESTAMP=$(cat /persist/M3_PipelineTimestamp.txt);
               env;
               .  ./scripts/score_docker_entrypoint.sh 
            imagePullPolicy: IfNotPresent
            resources:
              requests:
                memory: "8000Mi"
            env:
            - name: JOB
              value: "backlog"
            envFrom:
            # kubernetes secret loaded from build pipeline
            - secretRef:
                 name: model-scoring-secret
            - configMapRef:
                 name: model-scoring-config
            volumeMounts:
            - mountPath: /persist
              name: scoring-data

