apiVersion: batch/v1                 # Use the Kubernetes Batch API (Jobs/CronJobs live here)
kind: Job                            # This manifest creates a one-off Job (not a Deployment)

# kind: CronJob                      # (commented) Alternative: make it a repeating CronJob

metadata:
  name: model-training-sequenced-job-{TRAIN_TIMESTAMP}
                                     # Job name. The pipeline replaces {TRAIN_TIMESTAMP}
                                     # with a unique value so each run has a unique name.

spec:
  # uncomment if cronjob
  # schedule: "*/1 * * * *"          # (CronJob only) cron schedule — every minute, as example
  # concurrencyPolicy: Forbid         # (CronJob only) don’t start a new run if previous still running

  ttlSecondsAfterFinished: 3600       # Auto-garbage-collect Job (and its Pods) 1 hour after finish.
                                      # Keeps the cluster tidy; logs live in DevOps artifacts anyway.

  template:                           # Pod template: what the Job will run
    metadata:
      name: model-training-sequenced-job-{TRAIN_TIMESTAMP}
                                      # Pod name template (also gets timestamp injected)

    spec:
      # would be nice to have - but tidyverse will need a sudoers file drawn up to use this
      # securityContext:
      #   runAsUser: 1001
      #   fsGroup: 1001               # (commented) Example of running as non-root/user group

      # these tolerations and node selector will force job to run on gpu-capable pool
      tolerations:
      - key: sku
        operator: Equal
        value: gpu
        effect: NoSchedule            # Tolerate a "sku=gpu:NoSchedule" taint so Pod can land on GPU nodes

      nodeSelector:
        agentpool: gpunp              # Also *select* nodes labeled in the "gpunp" agent pool (GPU pool)

      initContainers:                 # Containers that must complete *before* main containers start
      - name: revenue-prediction-m1-m2-train
        image: rtirevenueprediction.azurecr.io/revenue-prediction-m1-m2-train:latest
                                      # Training image. In your pipeline, ":latest" is replaced with the
                                      # CI tag so you run the exact built image for that run.

        # memory request forces job/pod to the larger node pool
        command: ["/bin/sh"]          # Entrypoint for the init container
        args: ["-c",
               "env | grep -i -v key; \
                echo '{TRAIN_TIMESTAMP}' > ./TrainTimestamp.txt; \
                Rscript --verbose train.r"]
                                      # Shell script:
                                      # 1) print env (excluding *key* lines) for debugging
                                      # 2) write the TRAIN_TIMESTAMP to a file inside the container
                                      # 3) run your R training script verbosely

        imagePullPolicy: IfNotPresent # Pull image only if not cached on the node

        resources:
          requests:
            memory: "8000Mi"          # Ask for 8GiB so scheduler picks a suitably large node/pool

        env:                          # Explicit env vars for this container
        # moving this to the config map will prevent parallel runs. so leave it here even though it's common
        - name: TRAIN_TIMESTAMP
          value: "{TRAIN_TIMESTAMP}"  # The timestamp literal (replaced by pipeline before apply)

        - name: AZURE_STORAGE_OUTPUT_CONTAINER
          valueFrom:
            configMapKeyRef:
              name: model-training-config
              key: AZURE_MODEL2_OUTPUT_CONTAINER
                                      # Read the output container name from a ConfigMap key

        envFrom:
        # kubernetes secret loaded from build pipeline
        - secretRef:
            name: model-training-secret
                                      # Load all keys from Secret as env vars (e.g., SAS token, etc.)

        - configMapRef:
            name: model-training-config
                                      # Load remaining non-secret settings from ConfigMap as env vars

      containers:                     # Main workload containers (Job completion depends on these)
      - name: job-done
        image: busybox
        command: ['sh', '-c', 'echo "training completed"']
                                      # A tiny container that just echoes and exits 0.
                                      # Because training ran in the *init* container, a successful init +
                                      # this container exiting means the Job is considered complete.

      dnsPolicy: ClusterFirst         # Default cluster DNS resolution policy
      restartPolicy: Never            # If the container exits, don’t restart the Pod.
                                      # (The Job controller, not the Pod, handles retries/backoff.)
                                      
                                      
Notes & gotchas (useful context)
Init container does the training: That’s intentional here. If the training fails, the init container fails and the main container never starts, so the Job won’t reach “Succeeded”. Your pipeline step that monitors the Job will see this and fail appropriately.

GPU nodes: You’re scheduling onto GPU-tainted nodes via tolerations + nodeSelector. If you intend to actually use GPU, you typically also request them, e.g.:

yaml
Copy code
resources:
  limits:
    nvidia.com/gpu: 1
(Otherwise you’re just landing on GPU nodes without reserving a GPU device.)

Image tag replacement: Your pipeline replaces :latest with a CI build tag so each run uses a pinned image. Make sure the string you replace matches the manifest. If your pipeline replaces $(TrainImageName):latest but the manifest uses a full registry path, ensure $(TrainImageName) includes the registry path or adjust the replacement target accordingly.

ttlSecondsAfterFinished: Requires the TTL controller (it’s been GA in K8s for a while). It cleans up finished Jobs/Pods 3600s (1h) after completion—keeps the cluster tidy.

Cron option: If you convert to a CronJob, uncomment kind: CronJob, add spec.schedule, and move the Pod template under spec.jobTemplate.spec.template. concurrencyPolicy: Forbid is a good choice to avoid overlapping runs.







 