# parameters: block

# parameters:
# Declares template parameters for this YAML. When this file is used as a template (- template: deployscoreJobManifest.yml) the caller can pass values for these names. Parameters are compile-time values for templates (different from runtime variables).

# Each of the next lines defines one parameter and its default:

# DEPLOYMENT_SERVICE_CONNECTION: 'NOT_DEFINE'
# Placeholder for the Azure DevOps service connection (subscription / credentials) used for deployment. Default 'NOT_DEFINE' signals "not provided" so callers should supply an actual connection.

# NAMESPACE: 'NOT_DEFINE'
# Kubernetes namespace where resources should be applied. Default placeholder again.

# AZURE_STORAGE_ACCOUNT: 'NOT_DEFINE'
# Optional explicit Azure storage account name. If not provided, other logic (in calling template) may auto-discover or fail.

# AZURE_STORAGE_ACCOUNT_SAS_TOKEN: 'NOT_DEFINE'
# Placeholder for the SAS token used when creating Kubernetes secrets (if the template creates them).

# ARTIFACT_NAME: 'NOT_DEFINE'
# Name used for artifacts (if this template or caller publishes/downloads artifacts).

# AZURE_MODEL2_OUTPUT_CONTAINER: 'NOT_DEFINE'
# Config value for model output container name (used by the job/configmap).

# AZURE_STORAGE_WORKSPACE_CONTAINER: 'NOT_DEFINE'
# Config value for workspace container name.

# Why defaults 'NOT_DEFINE'?
# They act as safe placeholders so the template signature is explicit. The calling pipeline should pass real values; if they are left as 'NOT_DEFINE' you should expect downstream logic to either set sensible defaults or fail (depending on the implementation).

# steps: block

# steps:
# Start of the pipeline steps for this template.

#           - download: current
#             artifact: scratchpad


# - download: current
# This is the Azure DevOps download step shorthand. current means: download artifacts published in the current pipeline run (not from another pipeline resource). It is equivalent to using the DownloadPipelineArtifact task pointed at the current run.

# artifact: scratchpad
# Specifies the artifact name to download. The pipeline will fetch the artifact called scratchpad (which must have been published earlier in this pipeline run) and place its files into the agent’s working directories.

# Where the files land?
# Downloaded artifact contents are typically placed under $(Pipeline.Workspace)/scratchpad (or $(Pipeline.Workspace)/<artifact>); you can then reference files like $(Pipeline.Workspace)/scratchpad/TrainTimestamp.txt in subsequent steps.

# Short summary / purpose

# This template is minimal: it declares the common parameters expected by deploy templates and downloads a previously published artifact named scratchpad.

# It does not itself apply manifests or create secrets — it's intended to be included by another pipeline that expects the scratchpad artifact to be present (e.g., TrainTimestamp or prepared job manifests).

# Practical notes / gotchas

# If the caller does not publish an artifact named scratchpad earlier, this download will fail.

# Parameters default to 'NOT_DEFINE' — the caller should pass real values when necessary.

# This template only downloads the artifact; any logic that needs the artifact (parsing timestamps, applying manifests) must run in later steps in the including pipeline.
