#  deployTrainJobManifest.yaml

# job variables from pipeline
#        $(jobName)
#        $(jobManifest)
#

parameters:
  DEPLOYMENT_SERVICE_CONNECTION: 'NOT_DEFINE'
  NAMESPACE: 'NOT_DEFINE'
  AZURE_STORAGE_ACCOUNT: 'NOT_DEFINE'
  AZURE_STORAGE_ACCOUNT_SAS_TOKEN: 'NOT_DEFINE'
  ARTIFACT_NAME: 'NOT_DEFINE'
  AZURE_MODEL2_OUTPUT_CONTAINER: 'NOT_DEFINE'
  AZURE_STORAGE_WORKSPACE_CONTAINER: 'NOT_DEFINE'

steps:  
          - download: current
            artifact: scratchpad
          - bash: |
              TRAIN_TIMESTAMP=$(<'$(Pipeline.Workspace)/scratchpad/TrainTimestamp.txt') 
              # expose timestamp in build variable
              echo "##vso[task.setvariable variable=TrainTimestamp;]${TRAIN_TIMESTAMP}"
            
            displayName: 'Read training timestamp'

          - bash: |
              echo "TrainTimestamp is [$(TrainTimestamp)]"   
            displayName: 'Show results of train timestamp'
          
          - template: updateInstalls.yml  # Template reference

          - task: AzureCLI@2
            displayName: Get storage account name
            inputs:
              azureSubscription: '${{parameters.DEPLOYMENT_SERVICE_CONNECTION}}' 
              scriptType: 'pscore'
              scriptLocation: 'inlineScript'
              addSpnToEnvironment: true
              inlineScript: |

                 gci -recurse * | select directory, name

                 gci env: |  where Name -notmatch token | format-table -wrap

                 write-output "Image name is $(TrainImageName):$(resources.pipeline.sourcetrainbuild.runName)"
                 
                 $storageAccounts=(az resource list -o json | convertfrom-json) | where type -eq "Microsoft.Storage/storageAccounts"
                 $storageAccounts | format-table
                 $AzureStorageAccount='${{parameters.AZURE_STORAGE_ACCOUNT}}'
                 # if a specific storage account was not specified, take the storage account from the service connection
                 if ($AzureStorageAccount -eq 'NOT_DEFINE') {
                    $AzureStorageAccount = ($storageAccounts | select -First 1).name                   
                    }
                 Write-Host "##vso[task.setvariable variable=AzureStorageAccount;]$AzureStorageAccount"
                 Write-host "using storage account $AzureStorageAccount"

          - powershell: |
              $AZURE_STORAGE_OUTPUT_CONTAINER='${{parameters.AZURE_MODEL2_OUTPUT_CONTAINER}}' 
              $AZURE_STORAGE_WORKSPACE_CONTAINER='${{parameters.AZURE_STORAGE_WORKSPACE_CONTAINER}}'

              write-output 'storage account is $(AzureStorageAccount)'
              write-output "AZURE_STORAGE_OUTPUT_CONTAINER=$AZURE_STORAGE_OUTPUT_CONTAINER"
              write-output "AZURE_STORAGE_WORKSPACE_CONTAINER=$AZURE_STORAGE_WORKSPACE_CONTAINER "

              # set up storage containers
              $context = New-AzStorageContext -StorageAccountName '$(AzureStorageAccount)' -SasToken '${{parameters.AZURE_STORAGE_ACCOUNT_SAS_TOKEN}}'
              $contents = Get-AZStorageContainer -context $context
            
              if (-not ( $contents | where name -eq $AZURE_STORAGE_OUTPUT_CONTAINER)) {
                 New-AzStorageContainer -context $context -name $AZURE_STORAGE_OUTPUT_CONTAINER  -Permission Container
              }
              if (-not ( $contents | where name -eq $AZURE_STORAGE_WORKSPACE_CONTAINER)) {
                New-AzStorageContainer -context $context -name $AZURE_STORAGE_WORKSPACE_CONTAINER -Permission Container
              }
            
              # create a manifest which reflects the correct build

              (gc 'deployment/kubernetes/$(jobManifest)').replace('{TRAIN_TIMESTAMP}','$(TrainTimestamp)').replace('$(TrainImageName):latest','$(TrainImageName):$(resources.pipeline.sourcetrainbuild.runName)') `
                  > $(Build.ArtifactStagingDirectory)/$(jobManifest)
            
              gc $(Build.ArtifactStagingDirectory)/$(jobManifest)

            displayName: 'Prepare to run training through aks'

          - task: PowerShell@2
            displayName: 'Check Environment variables'
            inputs:
                targetType: 'inline'
                script: |
                  # Write your PowerShell commands here.
                      
                  gci env: | format-table -wrap
                  gci  -recurse | select fullname
          
          - task: AzureCLI@2
            displayName: Get aks cluster name
            inputs:
              azureSubscription: '${{parameters.DEPLOYMENT_SERVICE_CONNECTION}}'
              scriptType: 'pscore'
              scriptLocation: 'inlineScript'
              addSpnToEnvironment: true
              inlineScript: |
                # we arent using az aks list anymore as it's not working consistently in al environments
                $resources = az resource list -o json | convertfrom-json       
                $aksList = $resources | where 'type' -eq 'Microsoft.ContainerService/managedClusters'
                $aksList | format-table
                $aksName='$(aksName)'
                $aksResourceGroup='$(aksResourceGroup)'
                # use specific aks is named, otherwise derive from service connection permissions
                if (('set in script' -eq $aksResourceGroup) -or ('set in script' -eq $aksName))
                {
                  write-host "Setting aks from service connection environment"
                  $aksName = ($aksList | select -First 1).name
                  $aksResourceGroup= ($aksList | select -First 1).resourceGroup
                }
                Write-host "using aks $aksName resource group $aksResourceGroup "
                Write-Host "##vso[task.setvariable variable=aksName;]$aksName"
                Write-Host "##vso[task.setvariable variable=aksResourceGroup;]$aksResourceGroup"  
          
          - task: AzureCLI@2
            displayName: use kubelogin to connect
            inputs:
              azureSubscription: '${{parameters.DEPLOYMENT_SERVICE_CONNECTION}}'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |

                Write-host "using aks $(aksName) resource group $(aksResourceGroup)"
                rm -f ".kube/config" &&  az aks get-credentials --resource-group '$(aksResourceGroup)' \
                      --name '$(aksName)' \
                      --overwrite-existing 

                kubelogin convert-kubeconfig -l azurecli

                kubectl config set-context --current --namespace '${{parameters.NAMESPACE}}'

                kubectl get pods 2>&1

          - task: AzureCLI@2
            displayName: apply manifest
            inputs:
              azureSubscription: '${{parameters.DEPLOYMENT_SERVICE_CONNECTION}}'
              scriptType: 'pscore'
              powerShellErrorActionPreference: continue
              scriptLocation: 'inlineScript'
              inlineScript: |
                
                kubectl delete secret         $(jobName)-secret  2>&1 | Out-Null
                kubectl create secret generic $(jobName)-secret --from-literal=AZURE_SAS_TOKEN='${{parameters.AZURE_STORAGE_ACCOUNT_SAS_TOKEN}}'

                kubectl delete configmap      $(jobName)-config  2>&1 | Out-Null
                kubectl create configmap      $(jobName)-config --from-literal=AZURE_STORAGE_ACCOUNT=$(AzureStorageAccount) `
                                                                    --from-literal=WORKSPACE=azure `
                                                                    --from-literal=AZURE_MODEL2_OUTPUT_CONTAINER=${{parameters.AZURE_MODEL2_OUTPUT_CONTAINER}} `
                                                                    --from-literal=AZURE_STORAGE_WORKSPACE_CONTAINER=${{parameters.AZURE_STORAGE_WORKSPACE_CONTAINER}}

                # because this is a job, not a deployment, we do not have to do the "kubectl rollout restart"
                kubectl apply -f  $(Build.ArtifactStagingDirectory)/$(jobManifest)
              
                # outputFormat: yaml
          - task: AzureCLI@2
            displayName: 'Check job progress'
            inputs:
              azureSubscription: '${{parameters.DEPLOYMENT_SERVICE_CONNECTION}}'
              scriptType: 'pscore'
              powerShellErrorActionPreference: continue
              scriptLocation: 'inlineScript'
              inlineScript: |
                # this step replaces the "wait" function in the kubernetes task, which is not
                # working properly for extremely long runnign jobs..
                write-host "kubernetes resources available:"

                #for the logs
                kubectl get pods  2>&1 
                kubectl get jobs  2>&1
                kubectl get services  2>&1

                # there may be more than one job, scope to just the one this pipeline cares about
                $jobname = "$(jobName)-sequenced-job-$(TrainTimestamp)"
                
                  try {
                      $podSpec = kubectl get pods --selector=job-name=$jobname  -o json 2> $null | convertfrom-json
                      $podname = $podspec.items[0].metadata.name
                  }  
                      catch {}
                
                $completionTime=$null
                $logs=""
                $Failed = $false
                while (-not $failed -and $podName -and -not $completionTime) {
                
                  $jobSpec = kubectl get jobs  --selector=job-name=$jobname  -o json 2> $null | convertfrom-json
                  $completionTime = $jobspec.items[0].status.completionTime
                  $success=$jobspec.items[0].status.succeeded
                  $initFailed= ($pods.items | select -First 1).status.initContainerStatuses | where .state.reason -match 'Error' 
                  $failed= (($job.status.conditions.type -eq 'Failed') -or $initFailed)

                  $previouslogs = $logs
                  $logs= kubectl logs $podname  --all-containers --timestamps  2> $null
                  if ($logs -eq $null) { $logs=""}
                  compare-object -PassThru $previouslogs $logs
                
                  if (-not   $completionTime) {
                      write-output "waiting for job $jobname to complete..."
                      sleep 60
                  }
                }
                
                if (-not $podname) {
                    write-output("No pods found for job $jobname")
                    exit 1
                    }
                
                $logs > "$(Build.ArtifactStagingDirectory)/$($jobname).logs"
                
                if (-not ( $success -gt 0 )) {
                    write-output("Job $jobname failed")
                    exit 1
                    }
                  
                  write-output("Job $jobname succeeded")
                
                  exit 0


          - bash: |
              # place production train timestamp in a file to be available to future stages
              echo "$(TrainTimestamp)" >  TrainTimestamp.txt
              echo "Branch is $(resources.pipeline.sourcetrainbuild.sourceBranch)"
            displayName: 'record production train timestamp'
          - task: CopyFiles@2
            displayName: 'Copy final production timestamp file for use by other pipelines'
            inputs:
              contents: 'TrainTimestamp.txt'
              targetFolder: '$(Build.ArtifactStagingDirectory)'
          - publish: '$(Build.ArtifactStagingDirectory)'
            displayName: 'Publish timestamp file for later use'
            artifact: ${{parameters.ARTIFACT_NAME}}


Explanation:------------------------------------------------------------------------------

This template is reusable and defines the sequence of steps needed to:

Load the timestamp created in SetTimestamp.

Prepare Azure storage containers for input/output data.

Build a Kubernetes job manifest for training.

Connect to the correct AKS cluster.

Deploy the training job to Kubernetes.

Monitor the job progress until completion.

Save logs and timestamps as pipeline artifacts.

That way, Dev and Prod stages only need to provide different parameters (service connections, namespace, storage accounts, artifact names), but the workflow is identical.

📌 Step-by-step explanation
🔹 Parameters
parameters:
  DEPLOYMENT_SERVICE_CONNECTION: 'NOT_DEFINE'
  NAMESPACE: 'NOT_DEFINE'
  AZURE_STORAGE_ACCOUNT: 'NOT_DEFINE'
  AZURE_STORAGE_ACCOUNT_SAS_TOKEN: 'NOT_DEFINE'
  ARTIFACT_NAME: 'NOT_DEFINE'
  AZURE_MODEL2_OUTPUT_CONTAINER: 'NOT_DEFINE'
  AZURE_STORAGE_WORKSPACE_CONTAINER: 'NOT_DEFINE'


Inputs passed from the calling pipeline (DevTrain or ProdTrain).

These control:

Which AKS cluster to deploy to (DEPLOYMENT_SERVICE_CONNECTION, NAMESPACE).

Which storage account + SAS token to use.

Where artifacts/logs go (ARTIFACT_NAME).

==========================================================================================================================

🔹 Step 1: Get training timestamp
- download: current
  artifact: scratchpad

- bash: |
    TRAIN_TIMESTAMP=$(<'$(Pipeline.Workspace)/scratchpad/TrainTimestamp.txt') 
    echo "##vso[task.setvariable variable=TrainTimestamp;]${TRAIN_TIMESTAMP}"


Downloads the TrainTimestamp.txt artifact created in the SetTimestamp stage.

Exposes it as pipeline variable $(TrainTimestamp) so it can be reused.
==========================================================================================================================

🔹 Step 2: Update/install dependencies
- template: updateInstalls.yml


Runs a shared template (not shown here) to prepare environment/tools.
==========================================================================================================================

🔹 Step 3: Get storage account
- task: AzureCLI@2
  displayName: Get storage account name


Lists available storage accounts.

If one wasn’t passed in (NOT_DEFINE), it picks the first storage account from the service connection.

Sets pipeline variable $(AzureStorageAccount).
==========================================================================================================================

🔹 Step 4: Ensure storage containers exist
- powershell: |
    $AZURE_STORAGE_OUTPUT_CONTAINER='${{parameters.AZURE_MODEL2_OUTPUT_CONTAINER}}' 
    $AZURE_STORAGE_WORKSPACE_CONTAINER='${{parameters.AZURE_STORAGE_WORKSPACE_CONTAINER}}'
   


Validates that the output + workspace containers exist in the blob storage.

If missing, creates them using the SAS token.

$AZURE_STORAGE_OUTPUT_CONTAINER='${{parameters.AZURE_MODEL2_OUTPUT_CONTAINER}}' 
$AZURE_STORAGE_WORKSPACE_CONTAINER='${{parameters.AZURE_STORAGE_WORKSPACE_CONTAINER}}'
Reads pipeline parameters into PowerShell variables.

These are the container names where:

OUTPUT_CONTAINER → model outputs (trained model artifacts).

WORKSPACE_CONTAINER → intermediate/workspace files.

==========================================================================================================================


write-output 'storage account is $(AzureStorageAccount)'
write-output "AZURE_STORAGE_OUTPUT_CONTAINER=$AZURE_STORAGE_OUTPUT_CONTAINER"
write-output "AZURE_STORAGE_WORKSPACE_CONTAINER=$AZURE_STORAGE_WORKSPACE_CONTAINER "

Prints values (useful for debugging if something is misconfigured).

==========================================================================================================================


$context = New-AzStorageContext -StorageAccountName '$(AzureStorageAccount)' -SasToken '${{parameters.AZURE_STORAGE_ACCOUNT_SAS_TOKEN}}'
$contents = Get-AZStorageContainer -context $context

Creates a storage context for Azure Blob using account name + SAS token.

Lists all containers in that account ($contents).

==========================================================================================================================


if (-not ( $contents | where name -eq $AZURE_STORAGE_OUTPUT_CONTAINER)) {
   New-AzStorageContainer -context $context -name $AZURE_STORAGE_OUTPUT_CONTAINER  -Permission Container
}
if (-not ( $contents | where name -eq $AZURE_STORAGE_WORKSPACE_CONTAINER)) {
   New-AzStorageContainer -context $context -name $AZURE_STORAGE_WORKSPACE_CONTAINER -Permission Container
}
Ensures both required containers exist.

If not, creates them with Container-level access.
(This makes blobs accessible with a SAS token.)

==========================================================================================================================


(gc 'deployment/kubernetes/$(jobManifest)')
   .replace('{TRAIN_TIMESTAMP}','$(TrainTimestamp)')
   .replace('$(TrainImageName):latest','$(TrainImageName):$(resources.pipeline.sourcetrainbuild.runName)') `
   > $(Build.ArtifactStagingDirectory)/$(jobManifest)

Reads the Kubernetes job manifest template ($(jobManifest) is passed in from parameters).

Performs string replacements:

{TRAIN_TIMESTAMP} → actual timestamp of training run.

$(TrainImageName):latest → replaces :latest with the actual build run tag ($(resources.pipeline.sourcetrainbuild.runName)).

Writes updated manifest into the artifact staging directory, ready for deployment.

==========================================================================================================================




🔹 Step 5: Prepare Kubernetes manifest
(gc 'deployment/kubernetes/$(jobManifest)').replace('{TRAIN_TIMESTAMP}','$(TrainTimestamp)')...


Reads a Kubernetes job manifest file (from repo).

Replaces placeholders with:

The actual TrainTimestamp.

The actual container image tag ($(TrainImageName):$(resources.pipeline.sourcetrainbuild.runName)).

Saves the customized manifest into $(Build.ArtifactStagingDirectory).

==========================================================================================================================


🔹 Step 6: Get AKS cluster info
- task: AzureCLI@2
  displayName: Get aks cluster name


Looks up AKS clusters the service connection has access to.

If aksName and aksResourceGroup are not already set, picks the first one available.

Saves them as pipeline variables.

==========================================================================================================================

🔹 Step 7: Connect to AKS
- task: AzureCLI@2
  displayName: use kubelogin to connect


Uses az aks get-credentials + kubelogin to authenticate to the AKS cluster.

Switches to the namespace provided in the parameters.

Verifies by listing pods.

==========================================================================================================================


🔹 Step 8: Apply manifest
- task: AzureCLI@2
  displayName: apply manifest


Creates Kubernetes secrets/configmaps with:

SAS token.

Storage account name.

Container names.

Applies the Kubernetes job manifest (training job).

==========================================================================================================================


🔹 Step 9: Monitor job progress
- task: AzureCLI@2
  displayName: 'Check job progress'


Polls Kubernetes to:

Track pods created by the job.

Stream logs.

Detect completion/failure.

Writes job logs to pipeline artifacts.

Fails the pipeline if the Kubernetes job fails.

==========================================================================================================================


🔹 Step 10: Record final timestamp
- bash: |
    echo "$(TrainTimestamp)" > TrainTimestamp.txt
    echo "Branch is $(resources.pipeline.sourcetrainbuild.sourceBranch)"


Saves timestamp + branch for later stages to consume.

🔹 Step 11: Publish artifacts
- publish: '$(Build.ArtifactStagingDirectory)'
  artifact: ${{parameters.ARTIFACT_NAME}}


Publishes the final timestamp + logs under artifact name (e.g. devresults or prodresults).

This allows later pipelines/stages to retrieve the correct training run data.

✅ Summary

This template encapsulates the actual ML training deployment flow:

Load timestamp from earlier stage.

Validate/create Azure storage containers.

Generate job manifest with timestamp + build version.

Connect to AKS cluster and namespace.

Deploy Kubernetes training job.

Monitor logs and job completion.

Save outputs + logs as pipeline artifacts.

👉 Essentially:

DevTrain calls this with Dev AKS + Dev Storage + devresults.

ProdTrain calls this with Prod AKS + Prod Storage + prodresults.

The template itself doesn’t care if it’s Dev or Prod — the parameters make it reusable.